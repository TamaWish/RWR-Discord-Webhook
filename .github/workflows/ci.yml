name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RWR-Discord Webhook
        uses: actions/checkout@v5
      - name: Check out API contract
        uses: actions/checkout@v5
        with:
          repository: TamaWish/RWR-API
          ref: main
          token: ${{ secrets.RWR_API_READ_TOKEN }}
          path: .api-contract
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install unpublished API contract
        run: mvn --batch-mode --no-transfer-progress -f .api-contract/pom.xml clean install
      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean verify
