# =============================================================================
# RWR-Discord Webhook v1.0.0
# Author: Lozaine@TamaWish
# =============================================================================
# Webhook URLs and Discord settings live only in this add-on's data folder.
# Secrets are redacted from log output and are never written to the durable queue.
# =============================================================================

config-version: 1

# -----------------------------------------------------------------------------
# Locale
# -----------------------------------------------------------------------------
# Loads locales/<code>.yml from the data folder. Missing keys use English.
locale: en_US

# -----------------------------------------------------------------------------
# Discord Webhook
# -----------------------------------------------------------------------------
webhook:
  # How to create the webhook:
  # 1. Open Discord and select your server.
  # 2. Open Server Settings > Integrations > Webhooks.
  # 3. Select New Webhook and choose the RWR notification channel.
  # 4. Select Copy Webhook URL.
  # 5. Paste the URL between the quotes below, then run /rwr discord reload.
  #
  # Leave empty to disable delivery.
  # Example: https://discord.com/api/webhooks/1234567890/abcdef...
  url: ""

  # Name and avatar displayed for RWR notifications.
  username: "RWR"
  avatar_url: "https://files.catbox.moe/6pm9fu.png"

  # HTTP connection and response timeout in milliseconds.
  # Increase only if a slow network regularly times out.
  timeout-ms: 8000

  # Durable delivery settings. Defaults provide the strongest supported
  # reliability and are suitable for most servers.
  # queue-capacity: 1-500 pending notifications.
  # queue-ttl-hours: 1-24 hours before an undelivered entry expires.
  # max-attempts: 1-8 total attempts, including the first delivery.
  queue-capacity: 500
  queue-ttl-hours: 24
  max-attempts: 8

  # Minimum spacing between HTTP posts. Keep at least 1 second unless you have
  # a specific reason to allow faster delivery.
  min-interval-seconds: 1

# -----------------------------------------------------------------------------
# Notification Categories
# -----------------------------------------------------------------------------
# Toggle categories independently. Intermediate reset phases are never sent.
events:
  # One notification for every configured RWR warning threshold.
  warnings: true

  # Terminal COMPLETE resets.
  success: true

  # Terminal FAILED resets, excluding cancellations when separated below.
  failures: true

  # Resets cancelled by ResourceWorldPreResetEvent.
  cancellations: true

  # Operations recovered as interrupted after a restart or crash.
  interrupted: true

# -----------------------------------------------------------------------------
# Embed Appearance
# -----------------------------------------------------------------------------
# Discord embed colors are decimal RGB integers.
# Color picker: https://www.spycolor.com/
embeds:
  warning-color: 16776960      # yellow
  success-color: 5763719       # green
  failure-color: 15548997      # red
  cancellation-color: 15105570 # orange
  interrupted-color: 10181046  # purple

# -----------------------------------------------------------------------------
# Mentions
# -----------------------------------------------------------------------------
# Only IDs listed here can ping Discord users or roles. Locale strings and RWR
# event messages are always sanitized and cannot trigger mentions.
mentions:
  enabled: false

  # Role IDs to mention. Right-click a role in Discord (Developer Mode on) and
  # choose Copy Role ID. Use mentions.roles.all to ping on every notification.
  roles:
    all: ""
    configuration: ""
    warnings: ""
    success: ""
    failures: ""
    cancellations: ""
    interrupted: ""

  # User IDs to mention on every notification when mentions are enabled.
  users: []
