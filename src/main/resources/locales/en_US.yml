# RWR-Discord English locale (default + fallback).
# Placeholders use {name} form. Mentions are stripped from outbound webhook text.

command:
  no-permission: "You do not have permission: {permission}"
  unknown: "Unknown subcommand. Use /rwrdiscord reload|status."
  reload-success: "RWR-Discord configuration reloaded."
  reload-failed: "Reload failed: {reason}"
  status-header: "RWR-Discord status"
  status-service: "RWR API: {state}"
  status-webhook: "Webhook: {state}"
  status-queue: "Durable queue size: {size}"
  status-last-success: "Last successful delivery: {time}"
  status-last-failure: "Last failure: {time} ({detail})"
  status-retries: "Retry count (session): {count}"
  status-never: "never"

embed:
  warning-title: "Reset warning"
  warning-description: "A guarded reset is starting for {world_name}."
  success-title: "Reset complete"
  success-description: "World {world_name} was reset successfully."
  failure-title: "Reset failed"
  failure-description: "Reset of {world_name} failed."
  cancellation-title: "Reset cancelled"
  cancellation-description: "Reset of {world_name} was cancelled."
  interrupted-title: "Reset interrupted"
  interrupted-description: "A previous reset of {world_name} was recovered as interrupted."

  field-world-id: "World ID"
  field-world-name: "World name"
  field-operation: "Operation ID"
  field-phase: "Phase"
  field-failure: "Failure"
  field-safety: "Safety"
  field-message: "Detail"
  field-timestamp: "Timestamp"

  # Human-readable failure labels (keys match ResetFailureType enum names).
  failure-UNKNOWN_WORLD_ID: "Unknown world ID"
  failure-WORLD_NOT_MANAGED: "World not managed"
  failure-WORLD_BUSY: "World busy"
  failure-GLOBAL_RESET_BUSY: "Global reset lock held"
  failure-EVENT_CANCELLED: "Cancelled by event listener"
  failure-WORLD_NOT_REGISTERED: "World not registered"
  failure-WORLD_NOT_LOADED: "World not loaded"
  failure-WORLD_IDENTITY_CHANGED: "World identity changed"
  failure-EVACUATION_DISABLED: "Evacuation disabled"
  failure-EVACUATION_DESTINATION_UNAVAILABLE: "Evacuation destination unavailable"
  failure-EVACUATION_FAILED: "Evacuation failed"
  failure-PLAYERS_REMAINING: "Players remaining"
  failure-PROVIDER_REJECTED: "Provider rejected"
  failure-WORLD_DELETE_FAILED: "World delete failed"
  failure-WORLD_CREATE_FAILED: "World create failed"
  failure-PROVIDER_API_EXCEPTION: "Provider API exception"
  failure-VERIFICATION_FAILED: "Verification failed"
  failure-JOURNAL_UNAVAILABLE: "Journal unavailable"
  failure-INTERRUPTED_OPERATION: "Interrupted operation"

  safety-SAFE_TO_RETRY: "Safe to retry"
  safety-AMBIGUOUS_REVIEW_REQUIRED: "Review required"
  safety-NOT_RETRYABLE: "Not retryable"

  phase-PRECHECK: "Precheck"
  phase-EVACUATE: "Evacuate"
  phase-REGENERATE: "Regenerate"
  phase-VERIFY: "Verify"
  phase-COMPLETE: "Complete"
  phase-FAILED: "Failed"
  phase-INTERRUPTED: "Interrupted"
  phase-IDLE: "Idle"

log:
  enabled: "RWR-Discord enabled. RWR API available; webhook {webhook_state}."
  disabled-no-api: "RWR API is unavailable. RWR-Discord will stay loaded but inactive until RWR enables."
  webhook-missing: "Webhook URL is empty; deliveries are disabled."
  delivery-success: "Webhook delivered for {category} (operation={operation})."
  delivery-failed: "Webhook delivery failed for {category} after retries: {detail}"
  queue-full: "Webhook queue is full; dropping {category} event for operation={operation}."
  secret-redacted: "[redacted]"
