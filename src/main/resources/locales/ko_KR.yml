  # 리셋 단계 레이블
  # -----------------------------------------------------------------------------
  # 키 접미사는 내부 API 값입니다.

  phase-PRECHECK: "사전 검사"
  phase-EVACUATE: "대피"
  phase-REGENERATE: "재생성"
  phase-VERIFY: "검증"
  phase-COMPLETE: "완료"
  phase-FAILED: "실패"
  phase-INTERRUPTED: "중단"
  phase-IDLE: "대기"

# =============================================================================
# 콘솔 로그 메시지
# =============================================================================

log:
  enabled: "RWR-Discord Webhook이 활성화되었습니다. RWR API 사용 가능; webhook {webhook_state}."
  enabled-degraded: "RWR-Discord Webhook이 저하 모드로 활성화되었습니다. RWR API를 사용할 수 없어 이벤트 전송이 비활성화되었습니다. Webhook {webhook_state}."
  disabled-no-api: "RWR API를 사용할 수 없습니다. RWR이 활성화될 때까지 RWR-Discord Webhook은 로드된 상태로 비활성입니다."
  webhook-missing: "Webhook URL이 비어 있습니다. 전송이 비활성화됩니다."
  delivery-success: "{category} webhook을 전송했습니다 (operation={operation})."
  delivery-failed: "{category} webhook 전송이 재시도 후에도 실패했습니다: {detail}"
  queue-full: "Webhook 대기열이 가득 찼습니다. operation={operation}의 {category} 이벤트를 삭제합니다."
  secret-redacted: "[숨김]"
