  failure-EVACUATION_FAILED: "대피 실패"
  failure-PLAYERS_REMAINING: "플레이어가 남아 있음"
  failure-PROVIDER_REJECTED: "제공자가 거부함"
  failure-WORLD_DELETE_FAILED: "월드 삭제 실패"
  failure-WORLD_CREATE_FAILED: "월드 생성 실패"
  failure-PROVIDER_API_EXCEPTION: "제공자 API 예외"
  failure-VERIFICATION_FAILED: "검증 실패"
  failure-JOURNAL_UNAVAILABLE: "저널 사용 불가"
  failure-INTERRUPTED_OPERATION: "작업이 중단됨"

  # -----------------------------------------------------------------------------
  # 재시도 안전성 레이블
  # -----------------------------------------------------------------------------
  # 키 접미사는 내부 API 값입니다.

  safety-SAFE_TO_RETRY: "재시도 가능"
