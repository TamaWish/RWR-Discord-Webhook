  # -----------------------------------------------------------------------------

  field-world-id: "월드 ID"
  field-world-name: "월드 이름"
  field-operation: "작업 ID"
  field-remaining: "남은 시간"
  field-scheduled-at: "예정된 리셋"
  field-phase: "단계"
  field-failure: "실패 원인"
  field-safety: "안전성"
  field-message: "상세"
  field-timestamp: "타임스탬프"
  field-api-status: "RWR API"
  field-addon-version: "애드온 버전"
  field-server: "서버"

