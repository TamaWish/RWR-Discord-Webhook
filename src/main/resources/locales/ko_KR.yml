# =============================================================================
# RWR-Discord Webhook 한국어
# =============================================================================
# 런타임 자리 표시자는 {name} 형식입니다. 중괄호 안의 이름은 변경하지 마세요.
# 안전을 위해 송신 webhook 텍스트에서 멘션은 제거됩니다.
# =============================================================================

# =============================================================================
# 명령어 및 상태
# =============================================================================

command:
  no-permission: "권한이 없습니다: {permission}"
  unknown: "알 수 없는 하위 명령어입니다. /rwr discord reload|status를 사용하세요."
  reload-success: "RWR-Discord Webhook 구성을 다시 불러왔습니다."
  reload-failed: "다시 불러오기 실패: {reason}"
  status-header: "RWR-Discord Webhook 상태"
  status-service: "RWR API: {state}"
  status-webhook: "Webhook: {state}"
  status-queue: "영구 대기열 크기: {size}"
  status-last-success: "마지막 성공 전송: {time}"
  status-last-failure: "마지막 실패: {time} ({detail})"
  status-retries: "재시도 횟수(세션): {count}"
  status-never: "없음"

# =============================================================================
# Discord Embeds
# =============================================================================

embed:
  # -----------------------------------------------------------------------------
  # 제목 및 설명
  # -----------------------------------------------------------------------------

  configuration-title: "RWR-Discord Webhook 구성 완료"
  configuration-description: "Discord webhook 전송이 구성되었으며 ResourceWorldResetter 리셋 알림을 받을 준비가 되었습니다."
  legal-links: "[개인정보 처리방침]({privacy_url}) · [서비스 약관]({terms_url})"
  warning-title: "리셋 경고"
  warning-description: "{world_name} 리셋이 {remaining} 후에 예정되어 있습니다."
  success-title: "리셋 완료"
  success-description: "월드 {world_name}이(가) 성공적으로 리셋되었습니다."
  failure-title: "리셋 실패"
  failure-description: "월드 {world_name} 리셋에 실패했습니다."
  cancellation-title: "리셋 취소됨"
  cancellation-description: "월드 {world_name} 리셋이 취소되었습니다."
  interrupted-title: "리셋 중단됨"
  interrupted-description: "월드 {world_name}의 이전 리셋이 중단됨으로 복구되었습니다."

