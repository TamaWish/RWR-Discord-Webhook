# =============================================================================
# Bukkit Plugin Descriptor - RWR-Discord Webhook
# Generated Maven values use ${...} syntax and should remain unchanged.
# =============================================================================

# -----------------------------------------------------------------------------
# Plugin Metadata
# -----------------------------------------------------------------------------
name: RWR-Discord-Webhook
version: '${project.version}'
main: io.github.tamawish.rwr.discord.RwrDiscordPlugin
api-version: '1.21'
folia-supported: true
load: POSTWORLD
authors: [TamaWish, Lozaine]
description: Discord webhook add-on for ResourceWorldResetter on Spigot, CraftBukkit, Paper, Purpur, and Folia
website: https://github.com/TamaWish/RWR-Discord-Webhook
softdepend:
  - ResourceWorldResetter
  - ResourceWorldResetter-Paper-Folia

# -----------------------------------------------------------------------------
# Commands
# -----------------------------------------------------------------------------
commands:
  rwrdiscord:
    description: Legacy alias for /rwr discord
    usage: /rwr discord <reload|status>
    aliases: [rwr-discord, rwr-discord-webhook, rwrwh]

# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------
permissions:
  rwrdiscord.admin:
    description: Allows /rwr discord reload and status
    default: op
